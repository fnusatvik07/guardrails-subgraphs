</defs>
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="40" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="-0.2" opacity="1.0">Two kinds of guardrail</text>
  <text x="40" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">You almost always want both, in this order</text>
  <rect x="40" y="82" width="435" height="340" rx="16" ry="16" fill="#e8f5ee" stroke="#2f7d4f" stroke-width="1.5" opacity="1.0"/>
  <text x="62" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f7d4f" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1.0">DETERMINISTIC</text>
  <text x="62" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">Rules you wrote: regex, keyword lists,</text>
  <text x="62" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">numeric limits, allow-lists.</text>
  <text x="62" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2f7d4f" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Speed</text>
  <text x="196" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">microseconds</text>
  <line x1="62" y1="208" x2="452" y2="208" stroke="#c3e0ce" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2f7d4f" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Cost</text>
  <text x="196" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">free</text>
  <line x1="62" y1="248" x2="452" y2="248" stroke="#c3e0ce" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2f7d4f" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Repeatable</text>
  <text x="196" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">always the same answer</text>
  <line x1="62" y1="288" x2="452" y2="288" stroke="#c3e0ce" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="316" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2f7d4f" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Blind spot</text>
  <text x="196" y="316" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">paraphrases slip past</text>
  <line x1="62" y1="328" x2="452" y2="328" stroke="#c3e0ce" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="364" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">e.g. PIIMiddleware("email", strategy="redact")</text>
  <rect x="505" y="82" width="435" height="340" rx="16" ry="16" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="527" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="1.2" opacity="1.0">MODEL-BASED</text>
  <text x="527" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">A second LLM reads the text and judges</text>
  <text x="527" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">it: safe / unsafe, on-topic / off-topic.</text>
  <text x="527" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Speed</text>
  <text x="661" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">an extra round trip</text>
  <line x1="527" y1="208" x2="917" y2="208" stroke="#ecd9b6" stroke-width="1" stroke-linecap="round"/>
  <text x="527" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Cost</text>
  <text x="661" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">extra tokens, every call</text>
  <line x1="527" y1="248" x2="917" y2="248" stroke="#ecd9b6" stroke-width="1" stroke-linecap="round"/>
  <text x="527" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Repeatable</text>
  <text x="661" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">mostly, not guaranteed</text>
  <line x1="527" y1="288" x2="917" y2="288" stroke="#ecd9b6" stroke-width="1" stroke-linecap="round"/>
  <text x="527" y="316" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Strength</text>
  <text x="661" y="316" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">understands meaning</text>
  <line x1="527" y1="328" x2="917" y2="328" stroke="#ecd9b6" stroke-width="1" stroke-linecap="round"/>
  <text x="527" y="364" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">e.g. a small model asked SAFE or UNSAFE</text>
  <text x="490" y="450" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">Run the cheap rule first. Only pay for the judge on what survives it.</text>
</svg>
