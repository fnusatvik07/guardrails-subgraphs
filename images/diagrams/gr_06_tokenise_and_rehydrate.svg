  <rect x="48" y="532" width="912" height="48" rx="10" ry="10" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="504" y="554" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#1b2430" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">Why PIIMiddleware cannot do this: redact, mask and hash are all one way.</text>
  <text x="504" y="572" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">Nothing turns [REDACTED_SSN] back into a number, which is exactly what they are for.</text>
</svg>
