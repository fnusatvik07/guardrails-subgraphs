  <text x="500" y="486" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2430" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">The model can reason about the value, refer to it, and route it to a tool.</text>
