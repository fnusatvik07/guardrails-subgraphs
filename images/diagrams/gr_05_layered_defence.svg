</defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="-0.2" opacity="1.0">Defence in depth</text>
  <text x="40" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">Each layer is cheap enough that the next one rarely has to fire</text>
  <rect x="60" y="86" width="860" height="62" rx="12" ry="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="117" r="16" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <text x="94" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">1</text>
  <text x="126" y="113" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Content filter</text>
  <text x="126" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">banned words, obvious abuse</text>
  <text x="900" y="123" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#c0392b" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">before_agent</text>
  <rect x="60" y="158" width="860" height="62" rx="12" ry="12" fill="#e8effd" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="189" r="16" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="94" y="194" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">2</text>
  <text x="126" y="185" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">PII in</text>
  <text x="126" y="204" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">redact e-mail, mask card, block keys</text>
  <text x="900" y="195" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">before_model</text>
  <rect x="60" y="230" width="860" height="62" rx="12" ry="12" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="261" r="16" fill="#b45309" stroke="#b45309" stroke-width="1.5"/>
  <text x="94" y="266" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">3</text>
  <text x="126" y="257" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Tool policy</text>
  <text x="126" y="276" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">refuse a $5,000 transfer outright</text>
  <text x="900" y="267" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">wrap_tool_call</text>
  <rect x="60" y="302" width="860" height="62" rx="12" ry="12" fill="#f0eafc" stroke="#6d28d9" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="333" r="16" fill="#6d28d9" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="94" y="338" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">4</text>
  <text x="126" y="329" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Human approval</text>
  <text x="126" y="348" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">a person signs off on the rest</text>
  <text x="900" y="339" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#6d28d9" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">HumanInTheLoop</text>
  <rect x="60" y="374" width="860" height="62" rx="12" ry="12" fill="#e8effd" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="405" r="16" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="94" y="410" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">5</text>
  <text x="126" y="401" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">PII out</text>
  <text x="126" y="420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">the reply cannot leak it back</text>
  <text x="900" y="411" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">after_model</text>
  <rect x="60" y="446" width="860" height="62" rx="12" ry="12" fill="#e8f5ee" stroke="#2f7d4f" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94" cy="477" r="16" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="94" y="482" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1.0">6</text>
  <text x="126" y="473" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1.0">Safety judge</text>
  <text x="126" y="492" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">a model reads the final answer</text>
  <text x="900" y="483" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2f7d4f" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1.0">after_agent</text>
  <text x="490" y="538" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">A request has to pass every layer. An answer has to pass every layer on the way back.</text>
</svg>
