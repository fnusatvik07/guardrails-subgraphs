<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
  </marker>
  <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#c0392b"/>
  </marker>
  <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#2f7d4f"/>
  </marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arwV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#6d28d9"/>
  </marker>
</defs>
  <rect width="980" height="480" fill="#ffffff"/>
  <text x="40" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1b2430" font-weight="700" text-anchor="start" letter-spacing="-0.2" opacity="1.0">Seeing inside a running subgraph</text>
  <text x="40" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">Two views of the same run</text>
  <rect x="40" y="92" width="440" height="330" rx="16" ry="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="62" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start" letter-spacing="1.1" opacity="1.0">RAW EVENTS</text>
  <text x="62" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">One flat list. You read the namespace.</text>
  <rect x="62" y="166" width="396" height="44" rx="8" ry="8" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="78" y="186" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#6d28d9" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1.0">[]</text>
  <text x="300" y="186" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">node_1</text>
  <rect x="62" y="222" width="396" height="44" rx="8" ry="8" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="78" y="242" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1.0">['node_2:e58e...']</text>
  <text x="300" y="242" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">subgraph_node_1</text>
  <rect x="62" y="278" width="396" height="44" rx="8" ry="8" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="78" y="298" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1.0">['node_2:e58e...']</text>
  <text x="300" y="298" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">subgraph_node_2</text>
  <rect x="62" y="334" width="396" height="44" rx="8" ry="8" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/>
  <text x="78" y="354" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#6d28d9" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1.0">[]</text>
  <text x="300" y="354" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">node_2</text>
  <text x="260" y="400" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">depth is a string you have to parse</text>
  <rect x="516" y="92" width="424" height="330" rx="16" ry="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
  <text x="538" y="122" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="700" text-anchor="start" letter-spacing="0.6" opacity="1.0">stream.subgraphs</text>
  <text x="538" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#1b2430" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1.0">Already grouped, one handle per run.</text>
  <rect x="538" y="168" width="380" height="208" rx="12" ry="12" fill="#e8effd" stroke="#2563eb" stroke-width="1.5" opacity="1.0"/>
  <text x="728" y="196" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#1b2430" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1.0">for sg in stream.subgraphs:</text>
  <text x="728" y="222" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">sg.graph_name   -&gt;  'node_2'</text>
  <text x="728" y="244" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">sg.path         -&gt;  ('node_2:e58e...',)</text>
  <text x="728" y="266" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">sg.values       -&gt;  each state snapshot</text>
  <text x="728" y="288" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">sg.messages     -&gt;  tokens from inside</text>
  <line x1="566" y1="308" x2="890" y2="308" stroke="#c3d5f7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="728" y="334" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#1b2430" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">No string parsing. Works at any depth.</text>
  <text x="728" y="356" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">This is the one to reach for.</text>
  <text x="490" y="452" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1.0">Both come from  graph.stream_events(input, version="v3")</text>
</svg>
